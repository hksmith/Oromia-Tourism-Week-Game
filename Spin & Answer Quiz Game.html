<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin & Answer</title>
<style>
:root{
  --red:#D7263D; --redDark:#7A0F1F; --black:#111111; --white:#ffffff; --cream:#F7FAFC; --paper:#ffffff;
  --c1:#F2A007; --c2:#1B998B; --c3:#5B2A86; --c4:#2E7D32; --c5:#0E5FA6; --c6:#C2185B; --c7:#D7263D;
  --ink:#1b1b1b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  background-image: radial-gradient(circle at 15% 10%, #eef1f4 0%, var(--cream) 55%);
  color:var(--ink);
  min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
}
.top-logo{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;height:52px;width:auto;z-index:20;
  border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wrap{max-width:640px;width:100%;margin:0 auto;padding:28px 20px 10px;
  flex:1;display:flex;flex-direction:column;justify-content:center;}
header{text-align:center;margin-bottom:28px}
header h1{
  font-size:clamp(28px,7vw,42px); margin:0 0 6px; letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--black),var(--red),var(--black));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  font-weight:800;
}
header p{color:#666;margin:0;font-size:15px}
.hide{display:none !important}

/* generic gradient variants: red/black only */
.g0{background:linear-gradient(135deg,var(--red) 0%,var(--black) 100%)}
.g1{background:linear-gradient(135deg,var(--black) 0%,var(--red) 100%)}
.g2{background:linear-gradient(150deg,var(--red) 0%,var(--redDark) 55%,var(--black) 100%)}
.g3{background:linear-gradient(150deg,var(--black) 0%,var(--redDark) 55%,var(--red) 100%)}

/* Home screen */
#screen-home .option-grid{display:grid;grid-template-columns:1fr;gap:16px}
.option-card{
  border:none;border-radius:18px;padding:26px 22px;color:var(--white);cursor:pointer;text-align:left;
  box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .12s ease, box-shadow .12s ease;
}
.option-card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.option-card .icon{font-size:30px;display:block;margin-bottom:8px}
.option-card h2{margin:0 0 4px;font-size:20px}
.option-card p{margin:0;font-size:13.5px;opacity:.9}

/* Category screen (quiz) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat-btn{
  border:none;border-radius:16px;padding:22px 14px;color:var(--white);font-size:17px;font-weight:700;
  cursor:pointer;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cat-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cat-btn small{display:block;font-weight:400;opacity:.85;font-size:12.5px;margin-top:4px}

.back-link{background:none;border:none;color:#666;font-size:14px;cursor:pointer;margin-bottom:10px;padding:6px}

/* Wheel screen */
#screen-wheel{text-align:center}
.wheel-stage{position:relative;width:min(340px,80vw);height:min(340px,80vw);margin:10px auto 26px}
.pointer{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
  border-top:26px solid var(--black);z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--white);
  box-shadow:0 0 0 4px var(--black),0 10px 30px rgba(0,0,0,.3);
  transition:transform 4.2s cubic-bezier(.15,.65,.15,1);}
.hub{position:absolute;top:50%;left:50%;width:54px;height:54px;background:var(--white);border-radius:50%;
  transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--black);font-size:13px;box-shadow:0 0 0 4px var(--red);z-index:4}
.action-btn{
  background:linear-gradient(135deg,var(--black),var(--red));color:var(--white);border:none;border-radius:999px;padding:14px 34px;
  font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 #3d0509;letter-spacing:.3px;
}
.action-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3d0509}
.action-btn:disabled{opacity:.5;cursor:default}
#pool-status{margin-top:12px;color:#666;font-size:13px}

/* Facts screen */
#screen-facts{width:100%}
.facts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact-card{perspective:1000px;height:118px;cursor:pointer}
.fact-card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fact-card.flipped .fact-card-inner{transform:rotateY(180deg)}
.fact-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;color:var(--white);
  box-shadow:0 5px 0 rgba(0,0,0,.2)}
.fact-front .icon{font-size:22px;display:block;margin-bottom:6px}
.fact-front h3{margin:0;font-size:11.5px;line-height:1.25}
.fact-back{transform:rotateY(180deg);background:var(--black)}
.fact-back span{font-size:22px}

/* Modal (shared) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--paper);color:var(--ink);border-radius:18px;max-width:460px;width:100%;
  padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;overflow:hidden}
.modal .cat-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--white);
  background:var(--black);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.modal h2{font-size:20px;line-height:1.35;margin:0 0 18px}
.opt-btn{
  display:block;width:100%;text-align:left;background:var(--white);border:2px solid #e3e3e3;
  border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:15px;color:var(--ink);
  cursor:pointer;transition:border-color .15s, transform .1s;
}
.opt-btn:hover{border-color:var(--red)}
.opt-btn.correct{background:#111;border-color:var(--black);color:#fff;font-weight:700}
.opt-btn.wrong{background:var(--red);border-color:var(--redDark);color:#fff;font-weight:700}
.opt-btn:disabled{cursor:default}
.feedback{display:none;text-align:center;margin-top:4px}
.feedback.show{display:block}
.feedback h3{font-size:22px;margin:6px 0 4px}
.feedback.good h3{color:var(--black)}
.feedback.bad h3{color:var(--red)}
.feedback p{margin:0 0 16px;color:#555;font-size:14px}
.next-btn{background:linear-gradient(135deg,var(--black),var(--red));color:var(--white);border:none;border-radius:10px;padding:12px 20px;
  font-size:15px;font-weight:700;cursor:pointer;width:100%}
#fact-body{font-size:15.5px;line-height:1.5;color:#333;margin-bottom:18px}
canvas#fw{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}

footer.credit{text-align:center;margin-top:36px;padding-top:22px;border-top:1px solid #e3e3e3;
  display:flex;align-items:center;justify-content:center;gap:12px;color:#333;font-size:17px;font-weight:700}
footer.credit img{height:38px;width:38px;object-fit:contain}
</style>
</head>

  {icon:"🥾", title:"Trekking", fact:"Hiking and trekking are among the popular tourism activities across Shaggar City's sites."},
  {icon:"🎊", title:"Irreecha", fact:"Irreecha is a major Oromo thanksgiving tradition associated with renewal and the transition into Birraa (Spring)."},
  {icon:"🎭", title:"Oromo Traditions", fact:"Shinoyyee/Shinoye, Goobee and Guuski are documented among cultural practices associated with the Oromo culture."},
  {icon:"🏢", title:"AFLEX", fact:"AFLEX is identified as an important potential anchor for Shaggar's MICE (Meetings, Incentives, Conferences and Exhibitions) and leadership tourism."},
  {icon:"🌟", title:"Our Slogan", fact:"The proposed tourism slogan is: \"Shaggar – Where Nature, Culture and the Future Meet.\""},
  {icon:"📐", title:"1,600 km²", fact:"Shaggar city covers approximately 1,600 km² of area."},
];

let currentCat = null, pool = [], currentQ = null, wheelRotation = 0;

/* ---------- Navigation ---------- */
const screens = {
  home: document.getElementById('screen-home'),
  categories: document.getElementById('screen-categories'),
  wheel: document.getElementById('screen-wheel'),
  facts: document.getElementById('screen-facts'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.add('hide'));
  screens[name].classList.remove('hide');
}
showScreen('home');

document.getElementById('go-quiz').onclick = ()=>{ showScreen('categories'); };
document.getElementById('go-facts').onclick = ()=>{ showScreen('facts'); };
document.getElementById('back-home-1').onclick = ()=> showScreen('home');
document.getElementById('back-home-2').onclick = ()=> showScreen('home');
document.getElementById('back-btn').onclick = ()=> showScreen('categories');

/* ---------- Quiz: categories ---------- */
const catGrid = document.getElementById('cat-grid');
Object.keys(DATA).forEach((name,i)=>{
  const btn = document.createElement('button');
  btn.className='cat-btn ' + CAT_G[i % CAT_G.length];
  btn.innerHTML = `${name}<small>${DATA[name].questions.length} questions</small>`;
  btn.onclick = ()=>startCategory(name);
  catGrid.appendChild(btn);
});

function startCategory(name){
  currentCat = name;
  pool = DATA[name].questions.map((q,i)=>({...q, id:i}));
  showScreen('wheel');
  wheelRotation = 0;
  document.getElementById('wheel').style.transition='none';
  document.getElementById('wheel').style.transform='rotate(0deg)';
  drawWheel();
}

function drawWheel(){
  const svg = document.getElementById('wheel');
  const n = pool.length;
  const status = document.getElementById('pool-status');
  const spinBtn = document.getElementById('spin-btn');
  if(n===0){
    svg.innerHTML = `<circle cx="100" cy="100" r="96" fill="var(--black)"/><text x="100" y="105" text-anchor="middle" fill="#fff" font-size="14">All done!</text>`;
    status.textContent = `You've answered every question in ${currentCat}. Pick another topic!`;
    spinBtn.disabled = true;
    return;
  }
  spinBtn.disabled = false;
  status.textContent = `${n} question${n>1?'s':''} left in ${currentCat}`;
  const cx=100, cy=100, r=96;
  const slice = 360/n;
  let html = '';
  const colors = ["c1","c2","c5","c3","c4","c6","red"];
  for(let i=0;i<n;i++){
    const a0 = (i*slice - 90) * Math.PI/180;
    const a1 = ((i+1)*slice - 90) * Math.PI/180;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const large = slice>180?1:0;
    const fill = `var(--${colors[i%colors.length]})`;
    html += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#111" stroke-width="1.5"/>`;
    const mid = (a0+a1)/2;
    const tx = cx + (r*0.65)*Math.cos(mid), ty = cy + (r*0.65)*Math.sin(mid);
    html += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`;
  }
  svg.innerHTML = html;
}

document.getElementById('spin-btn').onclick = ()=>{
  if(pool.length===0) return;
  const spinBtn = document.getElementById('spin-btn');
  spinBtn.disabled = true;
  const n = pool.length;
  const slice = 360/n;
  const targetIndex = Math.floor(Math.random()*n);
  const targetCenterAngle = targetIndex*slice + slice/2;
  const extraSpins = 5*360;
  const finalRotation = wheelRotation + extraSpins + (360 - (wheelRotation%360) - targetCenterAngle + 720)%360;
  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'transform 4.2s cubic-bezier(.15,.65,.15,1)';
  wheel.style.transform = `rotate(${finalRotation}deg)`;
  wheelRotation = finalRotation;
  setTimeout(()=>{ openQuestion(pool[targetIndex]); }, 4300);
};

function openQuestion(qObj){
  currentQ = qObj;
  document.getElementById('modal-cat').textContent = currentCat;
  document.getElementById('modal-q').textContent = qObj.q;
  const optsWrap = document.getElementById('modal-opts');
  optsWrap.innerHTML='';
  document.getElementById('feedback').classList.remove('show');
  qObj.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt-btn';
    b.textContent = opt;
    b.onclick = ()=>answer(i,b);
    optsWrap.appendChild(b);
  });
  document.getElementById('overlay').classList.add('show');
}

function answer(i, btnEl){
  const buttons = [...document.querySelectorAll('#modal-opts .opt-btn')];
  buttons.forEach(b=>b.disabled=true);
  const isCorrect = i === currentQ.correct;
  buttons[currentQ.correct].classList.add('correct');
  if(!isCorrect) btnEl.classList.add('wrong');
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect?'good':'bad');
  document.getElementById('fb-title').textContent = isCorrect ? "Correct! 🎉" : "Not quite!";
  let sub = isCorrect ? "Nice one — you got it right." : `The correct answer was: ${currentQ.opts[currentQ.correct]}`;
  if(currentQ.explain) sub += " " + currentQ.explain;
  document.getElementById('fb-sub').textContent = sub;
  if(isCorrect) launchFireworks();
  pool = pool.filter(q=>q.id!==currentQ.id);
}

document.getElementById('next-btn').onclick = ()=>{
  document.getElementById('overlay').classList.remove('show');
  drawWheel();
};

/* ---------- Fact Reader ---------- */
const factsGrid = document.getElementById('facts-grid');
FACTS.forEach((f,i)=>{
  const card = document.createElement('div');
  card.className = 'fact-card';
  card.innerHTML = `
    <div class="fact-card-inner">
      <div class="fact-face fact-front ${CAT_G[i % CAT_G.length]}">
        <span class="icon">${f.icon}</span>
        <h3>${f.title}</h3>
      </div>
      <div class="fact-face fact-back"><span>${f.icon}</span></div>
    </div>`;
  card.onclick = ()=>{
    if(card.classList.contains('flipped')) return;
    card.classList.add('flipped');
    setTimeout(()=> openFact(f, card), 620);
  };
  factsGrid.appendChild(card);
});

function openFact(f, card){
  document.getElementById('fact-title').textContent = f.title;
  document.getElementById('fact-body').textContent = f.fact;
  document.getElementById('fact-overlay').classList.add('show');
  document.getElementById('fact-overlay').dataset.card = '';
  document.getElementById('fact-close-btn').onclick = ()=>{
    document.getElementById('fact-overlay').classList.remove('show');
    setTimeout(()=> card.classList.remove('flipped'), 250);
  };
}

/* ---------- Fireworks (correct-answer celebration) ---------- */
const fwCanvas = document.getElementById('fw');
const ctx = fwCanvas.getContext('2d');
function resizeFw(){ fwCanvas.width = innerWidth; fwCanvas.height = innerHeight; }
resizeFw(); addEventListener('resize', resizeFw);
function launchFireworks(){
  fwCanvas.style.display='block';
  const colors = ['#D7263D','#111111','#ffffff','#7A0F1F'];
  let particles = [];
  for(let burst=0; burst<3; burst++){
    setTimeout(()=>{
      const ox = innerWidth*(0.3+Math.random()*0.4);
      const oy = innerHeight*(0.25+Math.random()*0.3);
      for(let i=0;i<50;i++){
        const ang = Math.random()*Math.PI*2;
        const speed = 2+Math.random()*4;
        particles.push({x:ox,y:oy,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,
          color:colors[Math.floor(Math.random()*colors.length)],life:60+Math.random()*20});
      }
    }, burst*260);
  }
  let frame=0;
  function tick(){
    ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
      ctx.globalAlpha = Math.max(p.life/70,0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    particles = particles.filter(p=>p.life>0);
    frame++;
    if(frame<160){ requestAnimationFrame(tick); }
    else { ctx.clearRect(0,0,fwCanvas.width,fwCanvas.height); fwCanvas.style.display='none'; }
  }
  tick();
}
</script>
